name: Test and deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eventpass-ec2-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest

  deploy:
    name: Deploy on EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}

    steps:
      - name: Validate required secrets
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Pull latest code and restart compose
        run: |
          APP_DIR="${EC2_APP_DIR:-/opt/eventpass}"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" "APP_DIR='$APP_DIR' BRANCH='main' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "No existe un repositorio Git en $APP_DIR."
            echo "Haz el primer clone en EC2 siguiendo docs/EC2_DEPLOY_GUIDE.md."
            exit 1
          fi

          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          docker compose up -d --build
          docker image prune -f
          REMOTE_SCRIPT
