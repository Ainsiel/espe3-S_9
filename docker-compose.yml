services:
  backend:
    build:
      context: ./backend
    container_name: eventpass_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/db.sqlite3}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - eventpass_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/events', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: eventpass_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  eventpass_data:
